[workspace]
resolver = "2"
members = [
    "crates/photo-domain",
    "crates/photo-core",
    "crates/syncserver-client",
    "crates/platform-linux",
    "crates/platform-android",
    "crates/photo-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
photo-domain = { path = "crates/photo-domain" }
photo-core = { path = "crates/photo-core" }
syncserver-client = { path = "crates/syncserver-client" }
platform-linux = { path = "crates/platform-linux" }
platform-android = { path = "crates/platform-android" }
sync-client = { git = "https://github.com/Luyao-1024/syncserver.git", rev = "9097be58dbec0cc441ebb46068dc81f72d537368" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
flutter_rust_bridge = "=2.13.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
