schema_version: 1
profile_id: windows-x86_64
platform: windows
status: planned
flutter_target: windows
rust_target: x86_64-pc-windows-msvc
adapters:
  storage: windows_app_data
  source: windows_file_picker
  secrets: windows_credentials
  scheduler: while_app_running
  codec: portable_image
  instance_lock: windows_process_lock
limits:
  transfer_parallelism: 4
  original_parallelism: 2
  decoder_parallelism: 2
  decoder_total_mib: 192
  decoder_single_mib: 128
  image_cache_mib: 128
  viewer_cache_mib: 128
  browse_index_mib: 16
  gallery_rows_limit: 2000
  disk_cache_mib: 2048
ui:
  layout: adaptive
  keyboard_mouse: true
  touch: true
packaging:
  format: windows_installer
