schema_version: 1
profile_id: android-universal
platform: android
status: active
flutter_target: android
rust_target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
adapters:
  storage: android_private
  source: android_content_uri
  secrets: android_protected_session
  scheduler: android_system_budget
  codec: android_media_codec
  instance_lock: android_process_lock
limits:
  transfer_parallelism: 2
  original_parallelism: 1
  decoder_parallelism: 1
  decoder_total_mib: 64
  decoder_single_mib: 48
  image_cache_mib: 64
  viewer_cache_mib: 64
  browse_index_mib: 16
  gallery_rows_limit: 1000
  disk_cache_mib: 512
ui:
  layout: adaptive
  keyboard_mouse: true
  touch: true
packaging:
  format: apk_aab
